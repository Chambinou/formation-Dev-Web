<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Configuration de ton compte</title>
  </head>
  <body>
    <section id="container">
      <form action="#" method="post">
        <h1>Formulaires</h1>
        <!-- Champs de saisie : class="champ" -->
        <div class="champ">
          <!-- ✅ OBLIGATOIRE : ajoute required -->
          <label for="pseudo">Ton pseudo:</label><br />
          <input
            type="text"
            id="pseudo"
            name="pseudo"
            minlength="3"
            maxlength="20"
            placeholder="knight795"
            required
          />
          <br /><br />
          <label for="email">Ton email</label>
          <input type="email" id="email" name="email" required /><br /><br />
          <label for="password">Ton password</label>
          <input
            type="password"
            id="mdp"
            name="mdp"
            minlength="8"
            required
          /><br /><br />

          <!-- ❌ PAS required : c'est marqué "facultatif" -->
          <label for="date">Ta date de naissance</label>
          <input type="date" id="date" name="date" />

          <!-- ❌ PAS required sur les radios : c'est marqué "facultatif" -->
        </div>

        <div class="options">
          <h4>Saisissez votre genre (facultatif) :</h4>
          <input type="radio" name="Genre" id="Homme" value="Homme" />
          <label for="Homme">Homme</label>

          <input type="radio" name="Genre" id="Femme" value="Femme" />
          <label for="Femme">Femme</label>

          <input type="radio" name="Genre" id="Autre" value="Autre" />
          <label for="Autre">Autre</label>
        </div>
        <input type="submit" id="enregistrer" value="Envoyer" />
      </form>
    </section>
  </body>
</html>
